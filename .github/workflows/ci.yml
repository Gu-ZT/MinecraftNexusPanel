name: Quality

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  NODE_VERSION: "24"

jobs:
  quality:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x64
            runner: ubuntu-24.04
            cache_key: linux-x86_64
          - name: Windows x64
            runner: windows-latest
            cache_key: windows-x86_64
          - name: macOS ARM64
            runner: macos-14
            cache_key: macos-aarch64
    steps:
      - uses: actions/checkout@v5
      - name: Install Linux Tauri prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            build-essential \
            curl \
            file \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            wget
      - uses: pnpm/action-setup@v5
        with:
          version: 11.17.0
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: .
          key: ${{ matrix.cache_key }}-quality
      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile
      - name: Validate OpenAPI
        run: pnpm api:lint
      - name: Type-check Vue workspaces
        run: pnpm typecheck
      - name: Test release scripts
        run: node --test scripts/create-sha256.test.mjs
      - name: Build Vue application
        run: pnpm build
      - name: Check Rust formatting
        run: cargo fmt --all -- --check
      - name: Lint Rust workspace
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Test Rust workspace
        run: cargo test --workspace --locked
