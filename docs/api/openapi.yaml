    post:
      tags: [ Files ]
      operationId: completeFileUpload
      summary: Validate and commit a chunked instance file upload
      security:
        - cookieAuth: [ ]
          csrfToken: [ ]
        - bearerAuth: [ ]
      parameters:
        - $ref: '#/components/parameters/CoreId'
        - $ref: '#/components/parameters/TransferId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Uploaded file committed atomically
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FileEntry'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '428':
          $ref: '#/components/responses/PreconditionRequired'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /cores/{coreId}/uploads/{transferId}:
    delete:
      tags: [ Files ]
      operationId: abortFileUpload
      summary: Abort a chunked instance file upload
      security:
        - cookieAuth: [ ]
          csrfToken: [ ]
        - bearerAuth: [ ]
      parameters:
        - $ref: '#/components/parameters/CoreId'
        - $ref: '#/components/parameters/TransferId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '204':
          description: Upload aborted
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '428':
          $ref: '#/components/responses/PreconditionRequired'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /cores/{coreId}/downloads/{transferId}/parts/{partNumber}:
    get:
      tags: [ Files ]
      operationId: downloadFilePart
      summary: Download one chunk of an instance file
      parameters:
        - $ref: '#/components/parameters/CoreId'
        - $ref: '#/components/parameters/TransferId'
        - $ref: '#/components/parameters/PartNumber'
      responses:
        '200':
          description: Binary download chunk
          headers:
            ETag:
              description: SHA-256 based ETag of the complete file
              schema:
                type: string
            Content-SHA256:
              description: SHA-256 digest of this binary chunk
              schema:
                type: string
                pattern: '^[A-Fa-f0-9]{64}$'
            X-MCNP-File-Transfer-Offset:
              description: Byte offset of this chunk
              schema:
                type: integer
                format: int64
            X-MCNP-File-Transfer-Next-Offset:
              description: Next sequential byte offset accepted by the session
              schema:
                type: integer
                format: int64
            X-MCNP-File-Transfer-Size:
              description: Complete file size in bytes
              schema:
                type: integer
                format: int64
            X-MCNP-File-Eof:
              description: Whether this chunk reaches the end of the file
              schema:
                type: string
                enum: [ 'true', 'false' ]
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /cores/{coreId}/downloads/{transferId}/complete:
    post:
      tags: [ Files ]
      operationId: completeFileDownload
      summary: Validate and close a chunked instance file download
      security:
        - cookieAuth: [ ]
          csrfToken: [ ]
        - bearerAuth: [ ]
      parameters:
        - $ref: '#/components/parameters/CoreId'
        - $ref: '#/components/parameters/TransferId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '204':
          description: Download session closed
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '428':
          $ref: '#/components/responses/PreconditionRequired'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /cores/{coreId}/downloads/{transferId}:
    delete:
      tags: [ Files ]
      operationId: abortFileDownload
      summary: Abort a chunked instance file download
      security:
        - cookieAuth: [ ]
          csrfToken: [ ]
        - bearerAuth: [ ]
      parameters:
        - $ref: '#/components/parameters/CoreId'
        - $ref: '#/components/parameters/TransferId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '204':
          description: Download aborted
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '428':
          $ref: '#/components/responses/PreconditionRequired'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /cores/{coreId}/instances/{instanceId}/file-content:
    get:
      tags: [ Files ]
      operationId: readInstanceFile
      summary: Download an instance file
      parameters:
        - $ref: '#/components/parameters/CoreId'
        - $ref: '#/components/parameters/InstanceId'
        - $ref: '#/components/parameters/FilePath'
        - $ref: '#/components/parameters/FileOffset'
        - $ref: '#/components/parameters/FileLength'
      responses:
        '200':
          description: File content
          headers:
            ETag:
              description: SHA-256 based content ETag
              schema:
                type: string
            X-MCNP-File-Eof:
              description: Whether the returned chunk reaches the end of the file
              schema:
                type: string
                enum: [ 'true', 'false' ]
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [ Files ]
      operationId: writeInstanceFile
      summary: Atomically write a small instance file
      security:
        - cookieAuth: [ ]
          csrfToken: [ ]
        - bearerAuth: [ ]
      parameters:
        - $ref: '#/components/parameters/CoreId'
        - $ref: '#/components/parameters/InstanceId'
        - $ref: '#/components/parameters/FilePath'
        - $ref: '#/components/parameters/FileIfMatch'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
              maxLength: 1048576
      responses:
        '200':
          description: File written atomically
          headers:
            ETag:
              description: SHA-256 based content ETag for the written file
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FileEntry'
        '412':
          $ref: '#/components/responses/RevisionMismatch'
        '428':
          $ref: '#/components/responses/PreconditionRequired'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
  /tasks:
    get:
      tags: [ Tasks ]
      operationId: listTasks
      summary: List visible tasks
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - name: state
          in: query
          schema:
            $ref: '#/components/schemas/TaskState'
      responses:
        '200':
          description: Tasks visible to the current user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskPage'
        '401':
          $ref: '#/components/responses/Unauthenticated'
  /tasks/{taskId}:
    get:
      tags: [ Tasks ]
      operationId: getTask
      summary: Get a task
      parameters:
        - $ref: '#/components/parameters/TaskId'
      responses:
        '200':
          description: Task status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '404':
          $ref: '#/components/responses/NotFound'
  /tasks/{taskId}/actions/cancel:
    post:
      tags: [ Tasks ]
      operationId: cancelTask
      summary: Request task cancellation
      security:
        - cookieAuth: [ ]
          csrfToken: [ ]
        - bearerAuth: [ ]
      parameters:
        - $ref: '#/components/parameters/TaskId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '202':
          $ref: '#/components/responses/TaskAccepted'
        '409':
          $ref: '#/components/responses/Conflict'
components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: mcnp_session
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque
    csrfToken:
      type: apiKey
      in: header
      name: X-CSRF-Token
  headers:
    ETag:
      description: Quoted resource revision
      schema:
        type: string
  parameters:
    Cursor:
      name: cursor
      in: query
      description: Opaque pagination cursor
      schema:
        type: string
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    CoreId:
      name: coreId
      in: path
      required: true
      schema:
        type: string
    TemplateId:
      name: templateId
      in: path
      required: true
      schema:
        type: string
    InstanceId:
      name: instanceId
      in: path
      required: true
      schema:
        type: string
    DocumentId:
      name: documentId
      in: path
      required: true
      schema:
        type: string
        pattern: '^[A-Fa-f0-9]{64}$'
    RuntimeId:
      name: runtimeId
      in: path
      required: true
      schema:
        type: string
        pattern: '^[a-zA-Z0-9][a-zA-Z0-9._-]{0,63}$'
    ProxyInstanceId:
      name: proxyInstanceId
      in: path
      required: true
      schema:
        type: string
    SubserverId:
      name: subserverId
      in: path
      required: true
      schema:
        type: string
    TaskId:
      name: taskId
      in: path
      required: true
      schema:
        type: string
    CpuReservationId:
      name: reservationId
      in: path
      required: true
      schema:
        type: string
        minLength: 1
    FilePath:
      name: path
      in: query
      required: true
      description: UTF-8 path relative to the instance root
      schema:
        type: string
    FileDeleteConfirmation:
      name: confirmation
      in: query
      required: true
      description: Explicit confirmation for destructive file deletion
      schema:
        type: string
        const: DELETE
    FileOffset:
      name: offset
      in: query
      description: Byte offset of the requested chunk
      schema:
        type: integer
        format: int64
        minimum: 0
        default: 0
    FileLength:
      name: length
      in: query
      description: Number of bytes to read; Core accepts 1 through 32768
      schema:
        type: integer
        minimum: 1
        maximum: 32768
        default: 32768
    TransferId:
      name: transferId
      in: path
      required: true
      schema:
        type: string
    PartNumber:
      name: partNumber
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 0
    ContentSha256:
      name: Content-SHA256
      in: header
      required: true
      description: SHA-256 digest of the binary upload chunk
      schema:
        type: string
        pattern: '^[A-Fa-f0-9]{64}$'
    FileIfMatch:
      name: If-Match
      in: header
      description: Optional quoted SHA-256 of the current file content
      required: false
      schema:
        type: string
    IfMatch:
      name: If-Match
      in: header
      required: true
      schema:
        type: string
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        format: uuid
  responses:
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthenticated:
      description: Authentication required or expired
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: Insufficient permission
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Resource does not exist or is not visible
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Conflict:
      description: Resource or state conflict
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    UnprocessableEntity:
      description: A recognized document cannot be parsed or represented safely
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    RevisionMismatch:
      description: If-Match does not match current revision
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    PreconditionFailed:
      description: The supplied resource revision is no longer current
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    PreconditionRequired:
      description: Required idempotency precondition is missing
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    PayloadTooLarge:
      description: Payload exceeds endpoint limit
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    RateLimited:
      description: Request rate limit exceeded
      headers:
        Retry-After:
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    CoreFailure:
      description: Core authentication or protocol failure
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ServiceUnavailable:
      description: Panel or Core is temporarily unavailable
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    TaskAccepted:
      description: Asynchronous task accepted
      headers:
        Location:
          schema:
            type: string
        Retry-After:
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/TaskAccepted'
  schemas:
    Health:
      type: object
      required: [ status, time ]
      properties:
        status:
          type: string
          enum: [ ok ]
        time:
          type: string
          format: date-time
    SystemInfo:
      type: object
      required: [ version, apiVersions, capabilities, serverTime ]
      properties:
        version:
          type: string
        apiVersions:
          type: array
          items:
            type: string
        capabilities:
          type: array
          items:
            type: string
        minimumClientVersion:
          type: string
        serverTime:
          type: string
          format: date-time
    LoginRequest:
      type: object
      required: [ username, password, clientType ]
      properties:
        username:
          type: string
          minLength: 1
          maxLength: 64
        password:
          type: string
          minLength: 1
          maxLength: 1024
        clientType:
          type: string
          enum: [ BROWSER, NATIVE ]
        device:
          $ref: '#/components/schemas/Device'
        mfaCode:
          type: [ string, 'null' ]
    LoginResponse:
      type: object
      required: [ user, session ]
      properties:
        user:
          $ref: '#/components/schemas/User'
        session:
          $ref: '#/components/schemas/SessionTokens'
    Device:
      type: object
      required: [ name, platform, deviceId ]
      properties:
        name:
          type: string
          maxLength: 128
        platform:
          type: string
          enum: [ WEB, WINDOWS, LINUX, MACOS, ANDROID, IOS ]
        deviceId:
          type: string
          maxLength: 256
    SessionTokens:
      type: object
      required: [ id, accessExpiresAt ]
      properties:
        id:
          type: string
        accessToken:
          type: [ string, 'null' ]
          description: Returned only to native clients
        accessExpiresAt:
          type: string
          format: date-time
        refreshToken:
          type: [ string, 'null' ]
          description: Returned only to native clients
        refreshExpiresAt:
          type: [ string, 'null' ]
          format: date-time
        csrfToken:
          type: [ string, 'null' ]
          description: Returned only to browser clients
    User:
      type: object
      required: [ id, username, displayName, permissions ]
      properties:
        id:
          type: string
        username:
          type: string
        displayName:
          type: string
        permissions:
          type: array
          items:
            type: string
        resourceScopes:
          type: array
          items:
            type: string
    UserCreate:
      type: object
      additionalProperties: false
      required: [ username, displayName, password ]
      properties:
        username:
          type: string
          minLength: 1
          maxLength: 64
        displayName:
          type: string
          minLength: 1
          maxLength: 128
        password:
          type: string
          format: password
          minLength: 12
          maxLength: 1024
        permissions:
          type: array
          maxItems: 16
          default: [ ]
          items:
            type: string
            enum: [ audit.read ]
    UserPage:
      type: object
      required: [ items ]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/User'
    WebSocketTicket:
      type: object
      required: [ ticket, expiresAt ]
      properties:
        ticket:
          type: string
        expiresAt:
          type: string
          format: date-time
    CoreStatus:
      type: string
      enum: [ ONLINE, DEGRADED, OFFLINE, INCOMPATIBLE, AUTH_FAILED, UNKNOWN ]
    Core:
      type: object
      required:
        - id
        - name
        - address
        - status
        - capabilities
        - secretConfigured
        - skipCertificateVerification
        - tags
        - revision
      properties:
        id:
          type: string
        name:
          type: string
        address:
          type: string
          description: IP/localhost host:port or a tls, mcnp, or https URL
        status:
          $ref: '#/components/schemas/CoreStatus'
        latencyMs:
          type: [ integer, 'null' ]
          minimum: 0
        lastSeenAt:
          type: [ string, 'null' ]
          format: date-time
        version:
          type: [ string, 'null' ]
        protocolVersion:
          type: [ string, 'null' ]
        capabilities:
          type: array
          items:
            type: string
        secretConfigured:
          type: boolean
        secretUpdatedAt:
          type: [ string, 'null' ]
          format: date-time
        skipCertificateVerification:
          type: boolean
        certificateVerified:
          type: [ boolean, 'null' ]
        tlsCertificateSha256:
          type: [ string, 'null' ]
          pattern: '^[0-9a-f]{64}$'
        tags:
          type: array
          items:
            type: string
        revision:
          type: integer
          minimum: 1
    CoreCreate:
      type: object
      required: [ name, address, secret ]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 128
        address:
          type: string
          description: IP/localhost host:port or a tls, mcnp, or https URL
        secret:
          type: string
          minLength: 32
          writeOnly: true
        connectTimeoutSeconds:
          type: integer
          minimum: 1
          maximum: 60
          default: 10
        skipCertificateVerification:
          type: boolean
          default: false
        tags:
          type: array
          maxItems: 32
          items:
            type: string
    CoreUpdate:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 128
        address:
          type: string
        secret:
          type: string
          minLength: 32
          writeOnly: true
        connectTimeoutSeconds:
          type: integer
          minimum: 1
          maximum: 60
        skipCertificateVerification:
          type: boolean
        tags:
          type: array
          maxItems: 32
          items:
            type: string
    CorePage:
      type: object
      required: [ items, nextCursor ]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Core'
        nextCursor:
          type: [ string, 'null' ]
    CpuPerformanceClass:
      type: string
      enum: [ PERFORMANCE, EFFICIENCY, UNKNOWN ]
    CpuTopologyDetection:
      type: object
      required: [ source, confidence ]
      properties:
        source:
          type: string
        confidence:
          type: string
    CpuLogicalProcessor:
      type: object
      required: [ id, physicalCoreId, performanceClass, online, isolated, numaNode ]
      properties:
        id:
          type: integer
          minimum: 0
        physicalCoreId:
          type: [ string, 'null' ]
        performanceClass:
          $ref: '#/components/schemas/CpuPerformanceClass'
        online:
          type: boolean
        isolated:
          type: [ boolean, 'null' ]
        numaNode:
          type: [ integer, 'null' ]
          minimum: 0
    CpuAvailability:
      type: object
      required: [ performanceCpuIds, efficiencyCpuIds ]
      properties:
        performanceCpuIds:
          type: array
          items:
            type: integer
            minimum: 0
        efficiencyCpuIds:
          type: array
          items:
            type: integer
            minimum: 0
    CpuTopology:
      type: object
      required: [ architecture, logicalCpus, physicalCoreCount, available, detection ]
      properties:
        architecture:
          type: string
        logicalCpus:
          type: array
          items:
            $ref: '#/components/schemas/CpuLogicalProcessor'
        physicalCoreCount:
          type: [ integer, 'null' ]
          minimum: 1
        available:
          $ref: '#/components/schemas/CpuAvailability'
        detection:
          $ref: '#/components/schemas/CpuTopologyDetection'
    CpuPolicyMode:
      type: string
      enum: [ AUTO, PERFORMANCE, EFFICIENCY, CUSTOM ]
    CpuShareMode:
      type: string
      enum: [ SHARED, EXCLUSIVE ]
    CpuPolicy:
      type: object
      required: [ mode, requestedCpuIds, minCpus, maxCpus, preferPhysicalCores, numaNode, shareMode, strict ]
      properties:
        mode:
          $ref: '#/components/schemas/CpuPolicyMode'
        requestedCpuIds:
          type: array
          items:
            type: integer
            minimum: 0
        minCpus:
          type: integer
          minimum: 1
          maximum: 1000000
        maxCpus:
          type: [ integer, 'null' ]
          minimum: 1
          maximum: 1000000
        preferPhysicalCores:
          type: boolean
        numaNode:
          type: [ integer, 'null' ]
          minimum: 0
        shareMode:
          $ref: '#/components/schemas/CpuShareMode'
        strict:
          type: boolean
    CpuPolicyResolution:
      type: object
      required: [ requested, candidateCpuIds, selectedCpuIds, performanceClass, conflicts, degradedReason, reservationId ]
      properties:
        requested:
          $ref: '#/components/schemas/CpuPolicy'
        candidateCpuIds:
          type: array
          items:
            type: integer
            minimum: 0
        selectedCpuIds:
          type: array
          items:
            type: integer
            minimum: 0
        performanceClass:
          $ref: '#/components/schemas/CpuPerformanceClass'
        conflicts:
          type: array
          items:
            type: string
        degradedReason:
          type: [ string, 'null' ]
        reservationId:
          type: [ string, 'null' ]
    CpuReservation:
      type: object
      required: [ reservationId, instanceId, cpuIds, createdAt ]
      properties:
        reservationId:
          type: string
          minLength: 1
        instanceId:
          type: string
          minLength: 1
        cpuIds:
          type: array
          items:
            type: integer
            minimum: 0
        createdAt:
          type: string
          format: date-time
    CpuReservationPage:
      type: object
      required: [ items ]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/CpuReservation'
    CpuReservationRequest:
      type: object
      required: [ instanceId, revision, policy ]
      additionalProperties: false
      properties:
        instanceId:
          type: string
          minLength: 1
        revision:
          type: integer
          minimum: 1
        policy:
          $ref: '#/components/schemas/CpuPolicy'
    CpuReservationResult:
      type: object
      required: [ reservation, appliedPolicy ]
      properties:
        reservation:
          $ref: '#/components/schemas/CpuReservation'
        appliedPolicy:
          $ref: '#/components/schemas/CpuPolicyResolution'
    RuntimeKind:
      type: string
      enum: [ JAVA, NODE_JS, PYTHON ]
    InstallRuntimeRequirement:
      type: string
      enum: [ JAVA, NODE_JS, PYTHON, PHP, NATIVE ]
    InstallTemplateFamily:
      type: string
