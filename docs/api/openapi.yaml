openapi: 3.1.0
info:
  title: Minecraft Nexus Panel (MCNP) API
  version: 0.1.0-draft
  summary: Panel API for Web, Desktop, and Mobile clients
  description: |
    Draft v1 contract. Browser clients use a secure session cookie plus CSRF
    token for writes. Native clients use bearer access tokens and rotating
    refresh tokens.
servers:
  - url: /api/v1
    description: Current Panel
tags:
  - name: System
    description: Panel health, version, and capabilities
  - name: Auth
    description: User and device session lifecycle
  - name: Users
    description: Administrator-managed Panel users and implemented permission grants
  - name: Realtime
    description: WebSocket connection bootstrap
  - name: Cores
    description: Remote Core registration and connectivity
  - name: Install templates
    description: Built-in server templates and version metadata sources
  - name: Instances
    description: Minecraft instance configuration and lifecycle
  - name: Proxy
    description: Proxy backend and subserver relationships
  - name: Bedrock
    description: Bedrock server and bridge operations
  - name: Extensions
    description: Installed mod and plugin discovery and lifecycle operations
  - name: Files
    description: Sandboxed instance file operations
  - name: Configuration
    description: Structured instance configuration documents and lossless patches
  - name: Tasks
    description: Long-running operation status and cancellation
  - name: Audit
    description: Permission-protected immutable Panel request audit records
security:
  - cookieAuth: [ ]
  - bearerAuth: [ ]
paths:
  /install-templates:
    get:
      tags: [ Install templates ]
      operationId: listInstallTemplates
      summary: List built-in server install templates
      responses:
        '200':
          description: Install templates and their trusted version metadata sources
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InstallTemplatePage'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
  /install-templates/{templateId}/versions:
    get:
      tags: [ Install templates ]
      operationId: listInstallTemplateVersions
      summary: Resolve the current official versions for an install template
      parameters:
        - $ref: '#/components/parameters/TemplateId'
      responses:
        '200':
          description: Parsed official game, loader, or server versions for the template
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InstallTemplateVersionPage'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '502':
          description: An official version metadata source could not be queried or parsed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /extension-catalog/search:
    get:
      tags: [ Extensions ]
      operationId: searchExtensionCatalog
      summary: Search extension projects from a trusted public source
      description: |
        Search Modrinth projects as MOD or PLUGIN records. The returned
        compatibility value is a source metadata hint based on the requested
        Minecraft version and loader; it is not an installation verification.
      parameters:
        - name: query
          in: query
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 128
        - name: type
          in: query
          required: true
          schema:
            $ref: '#/components/schemas/ExtensionKind'
        - name: source
          in: query
          schema:
            type: string
            default: modrinth
            enum: [ modrinth ]
        - name: minecraftVersion
          in: query
          schema:
            type: string
            maxLength: 64
        - name: loader
          in: query
          schema:
            type: string
            maxLength: 64
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 20
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
            maximum: 10000
            default: 0
      responses:
        '200':
          description: Extension projects and source compatibility hints
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExtensionSearchResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '502':
          description: The extension source could not be queried or parsed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /extension-catalog/projects/{source}/{projectId}:
    get:
      tags: [ Extensions ]
      operationId: getExtensionProjectVersions
      summary: Read extension project versions and dependency metadata
      description: |
        Read Modrinth project versions, dependency records, and HTTPS files
        with SHA-512 metadata. This endpoint prepares installation input but
        does not resolve a dependency graph or download an artifact.
      parameters:
        - name: source
          in: path
          required: true
          schema:
            type: string
            enum: [ modrinth ]
        - name: projectId
          in: path
          required: true
          schema:
            type: string
            pattern: '^[A-Za-z0-9_-]{1,64}$'
        - name: minecraftVersion
          in: query
          schema:
            type: string
            maxLength: 64
        - name: loader
          in: query
          schema:
            type: string
            maxLength: 64
      responses:
        '200':
          description: Extension project versions and dependency metadata
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExtensionVersionResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '502':
          description: The extension source could not be queried or parsed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /cores/{coreId}/instances/{instanceId}/extension-plans:resolve:
    post:
      tags: [ Extensions ]
      operationId: resolveExtensionPlan
      summary: Resolve a bounded extension dependency plan
      description: |
        Resolve a Modrinth root version and its required dependencies for an
        instance template. The response contains verified HTTPS artifact
        metadata, but this operation does not download or install files.
      security:
        - cookieAuth: [ ]
          csrfToken: [ ]
        - bearerAuth: [ ]
      parameters:
        - $ref: '#/components/parameters/CoreId'
        - $ref: '#/components/parameters/InstanceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExtensionPlanRequest'
      responses:
        '200':
          description: Resolved extension dependency plan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExtensionPlanResolution'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          description: Required dependencies could not be resolved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '502':
          description: The extension source could not be queried or parsed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /health/live:
    get:
      tags: [ System ]
      operationId: getLiveness
      summary: Check process liveness
      security: [ ]
      responses:
        '200':
          description: Panel process is alive
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
        '400':
          $ref: '#/components/responses/BadRequest'
  /health/ready:
    get:
      tags: [ System ]
      operationId: getReadiness
      summary: Check service readiness
      security: [ ]
      responses:
        '200':
          description: Panel can accept traffic
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '400':
          $ref: '#/components/responses/BadRequest'
  /system/info:
    get:
      tags: [ System ]
      operationId: getSystemInfo
      summary: Get Panel version and capabilities
      responses:
        '200':
          description: Panel version and API capabilities
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemInfo'
        '401':
          $ref: '#/components/responses/Unauthenticated'
  /auth/login:
    post:
      tags: [ Auth ]
      operationId: login
      summary: Create a browser or native session
      security: [ ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Login succeeded
          headers:
            Set-Cookie:
              description: Browser session cookie when clientType is BROWSER
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '429':
          $ref: '#/components/responses/RateLimited'
  /auth/refresh:
    post:
      tags: [ Auth ]
      operationId: refreshSession
      summary: Rotate session credentials
      description: |
        Native clients send refreshToken in the body. Browser clients use the
        secure session cookie and include X-CSRF-Token.
      security:
        - cookieAuth: [ ]
          csrfToken: [ ]
        - { }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                refreshToken:
                  type: string
      responses:
        '200':
          description: Session credentials were rotated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionTokens'
        '401':
          $ref: '#/components/responses/Unauthenticated'
  /auth/logout:
    post:
      tags: [ Auth ]
      operationId: logout
      summary: Revoke the current session
      security:
        - cookieAuth: [ ]
          csrfToken: [ ]
        - bearerAuth: [ ]
      responses:
        '204':
          description: Session revoked
        '401':
          $ref: '#/components/responses/Unauthenticated'
  /auth/me:
    get:
      tags: [ Auth ]
      operationId: getCurrentUser
      summary: Get the current user and permissions
      responses:
        '200':
          description: Current user and effective permissions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthenticated'
  /users:
    get:
      tags: [ Users ]
      operationId: listUsers
      summary: List Panel users
      description: Administrators can list users and their effective permission names.
      responses:
        '200':
          description: Users ordered by username
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserPage'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/ServiceUnavailable'
    post:
      tags: [ Users ]
      operationId: createUser
      summary: Create a non-administrator Panel user
      description: |
        Administrators can create non-administrator users. The current assignable
        permission catalog contains only audit.read; unsupported permission names
        are rejected instead of being stored as ineffective grants.
      security:
        - cookieAuth: [ ]
          csrfToken: [ ]
        - bearerAuth: [ ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserCreate'
      responses:
        '201':
          description: User created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/ServiceUnavailable'
  /audit-events:
    get:
      tags: [ Audit ]
      operationId: listAuditEvents
      summary: Read Panel user-level audit events
      description: |
        Read immutable request metadata retained by Panel. Administrators and
        non-administrators with audit.read can access this endpoint. Query strings,
        request bodies, cookies, access tokens, refresh tokens, and passwords are
        never returned or persisted.
        Results are ordered newest first and the store retains at most 10,000
        events.
      parameters:
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Panel request audit events
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PanelAuditPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/ServiceUnavailable'
  /ws/tickets:
    post:
      tags: [ Realtime ]
      operationId: createWebSocketTicket
      summary: Create a single-use WebSocket ticket
      security:
        - cookieAuth: [ ]
          csrfToken: [ ]
        - bearerAuth: [ ]
      responses:
        '201':
          description: Single-use ticket valid for 30 seconds
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebSocketTicket'
        '401':
          $ref: '#/components/responses/Unauthenticated'
  /cores:
    get:
      tags: [ Cores ]
      operationId: listCores
      summary: List visible Core nodes
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/CoreStatus'
      responses:
        '200':
          description: Cores visible to the current user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CorePage'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [ Cores ]
      operationId: createCore
      summary: Register a Core node
      security:
        - cookieAuth: [ ]
          csrfToken: [ ]
        - bearerAuth: [ ]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CoreCreate'
      responses:
        '201':
          description: Core registered; secret is never returned
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Core'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '502':
          $ref: '#/components/responses/CoreFailure'
  /cores/{coreId}:
    parameters:
      - $ref: '#/components/parameters/CoreId'
    get:
      tags: [ Cores ]
      operationId: getCore
      summary: Get a Core node
      responses:
        '200':
          description: Core details
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Core'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [ Cores ]
      operationId: updateCore
      summary: Update a Core registration
      security:
        - cookieAuth: [ ]
          csrfToken: [ ]
        - bearerAuth: [ ]
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema:
              $ref: '#/components/schemas/CoreUpdate'
      responses:
        '200':
          description: Updated Core
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Core'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '412':
          $ref: '#/components/responses/RevisionMismatch'
    delete:
      tags: [ Cores ]
      operationId: deleteCore
      summary: Remove a Core registration
      security:
        - cookieAuth: [ ]
          csrfToken: [ ]
        - bearerAuth: [ ]
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      responses:
        '204':
          description: Core registration removed; remote data is untouched
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '412':
          $ref: '#/components/responses/RevisionMismatch'
  /cores/{coreId}/actions/test:
    post:
      tags: [ Cores ]
      operationId: testCoreConnection
      summary: Test Core connectivity and credentials
      security:
        - cookieAuth: [ ]
          csrfToken: [ ]
        - bearerAuth: [ ]
      parameters:
        - $ref: '#/components/parameters/CoreId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Connection test result
          content:
            application/json:
              schema:
                type: object
                required: [ success, latencyMs ]
                properties:
                  success:
                    type: boolean
                  latencyMs:
                    type: integer
                    minimum: 0
                  protocolVersion:
                    type: string
        '502':
          $ref: '#/components/responses/CoreFailure'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '403':
          $ref: '#/components/responses/Forbidden'
  /cores/{coreId}/actions/reconnect:
    post:
      tags: [ Cores ]
      operationId: reconnectCore
      summary: Drop the current connection and reconnect a Core
      security:
        - cookieAuth: [ ]
          csrfToken: [ ]
        - bearerAuth: [ ]
      parameters:
        - $ref: '#/components/parameters/CoreId'
      responses:
        '202':
          description: Reconnect scheduled
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Core'
        '404':
          $ref: '#/components/responses/NotFound'
        '403':
          $ref: '#/components/responses/Forbidden'
  /cores/{coreId}/cpu-topology:
    get:
      tags: [ Cores ]
      operationId: getCpuTopology
      summary: Read the Core host CPU topology
      description: |
        Return the topology snapshot cached by Core at startup. Unknown
        performance classes, NUMA mappings, and isolation state are explicit
        unknown values; clients must not infer them from CPU indexes.
      parameters:
        - $ref: '#/components/parameters/CoreId'
      responses:
        '200':
          description: Core CPU topology snapshot
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CpuTopology'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '502':
          $ref: '#/components/responses/CoreFailure'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /cores/{coreId}/cpu-policies:resolve:
    post:
      tags: [ Cores ]
      operationId: resolveCpuPolicy
      summary: Preview a CPU policy against the Core topology
      description: |
        Return candidates and a deterministic recommendation without applying
        host affinity or creating an exclusive reservation. Strict requests
        fail when the topology cannot prove the requested capacity.
      parameters:
        - $ref: '#/components/parameters/CoreId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CpuPolicy'
      responses:
        '200':
          description: Read-only CPU policy resolution
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CpuPolicyResolution'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '502':
          $ref: '#/components/responses/CoreFailure'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /cores/{coreId}/cpu-reservations:
    get:
      tags: [ Cores ]
      operationId: listCpuReservations
      summary: List CPU exclusive reservations registered by a Core
      description: |
        Return the Core-local reservation records. Core persists the latest
        reservation snapshot in cpu-reservations.json and restores it after a
        restart. A reservation proves only that the Core selected a
        non-overlapping CPU set for the instance; it does not prove that host
        affinity or Docker cpuset has been applied, or that another Core has
        honored the same reservation.
      parameters:
        - $ref: '#/components/parameters/CoreId'
      responses:
        '200':
          description: Persisted Core-local CPU reservation records
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CpuReservationPage'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '502':
          $ref: '#/components/responses/CoreFailure'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
    post:
      tags: [ Cores ]
      operationId: reserveCpu
      summary: Register an exclusive CPU reservation on a Core
      description: |
        Validate the instance revision, resolve an EXCLUSIVE CPU policy, and
        atomically register the selected CPU IDs. The selected reservation is
        persisted through an atomic cpu-reservations.json snapshot. The
        operation requires an idempotency key, but is synchronous and is not a
        durable task-center guarantee.
      security:
        - cookieAuth: [ ]
          csrfToken: [ ]
        - bearerAuth: [ ]
      parameters:
        - $ref: '#/components/parameters/CoreId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CpuReservationRequest'
      responses:
        '201':
          description: CPU reservation registered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CpuReservationResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '428':
          $ref: '#/components/responses/PreconditionRequired'
        '502':
          $ref: '#/components/responses/CoreFailure'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /cores/{coreId}/cpu-reservations/{reservationId}:
    delete:
      tags: [ Cores ]
      operationId: releaseCpu
      summary: Release a Core-local CPU exclusive reservation
      security:
        - cookieAuth: [ ]
          csrfToken: [ ]
        - bearerAuth: [ ]
      parameters:
        - $ref: '#/components/parameters/CoreId'
        - $ref: '#/components/parameters/CpuReservationId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '204':
          description: CPU reservation released
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '428':
          $ref: '#/components/responses/PreconditionRequired'
        '502':
          $ref: '#/components/responses/CoreFailure'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /cores/{coreId}/environments:
    get:
      tags: [ Environments ]
      operationId: listManagedRuntimes
      summary: Discover Java, Node.js, and Python runtimes on a Core
      parameters:
        - $ref: '#/components/parameters/CoreId'
      responses:
        '200':
          description: Discovered managed and system runtimes with validation state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManagedRuntimePage'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '403':
          $ref: '#/components/responses/Forbidden'
  /cores/{coreId}/runtime-installations:
    post:
      tags: [ Environments ]
      operationId: installRuntime
      summary: Install a verified managed runtime archive
      security:
        - cookieAuth: [ ]
          csrfToken: [ ]
        - bearerAuth: [ ]
      parameters:
        - $ref: '#/components/parameters/CoreId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RuntimeInstallationRequest'
      responses:
        '202':
          description: Runtime installed and operation task recorded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RuntimeOperation'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
        '412':
          $ref: '#/components/responses/PreconditionRequired'
        '503':
