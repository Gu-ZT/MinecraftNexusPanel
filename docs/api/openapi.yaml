          type: [ string, 'null' ]
    Instance:
      type: object
      required: [ id, coreId, name, kind, directory, launch, cpuPolicy, updateCommand, expiresAt, runtime, revision ]
      properties:
        id:
          type: string
        coreId:
          type: string
        name:
          type: string
        kind:
          $ref: '#/components/schemas/InstanceKind'
        directory:
          type: string
        launch:
          $ref: '#/components/schemas/LaunchConfig'
        cpuPolicy:
          $ref: '#/components/schemas/CpuPolicy'
        updateCommand:
          type: [ string, 'null' ]
          maxLength: 8192
        expiresAt:
          type: [ string, 'null' ]
          format: date-time
        runtime:
          $ref: '#/components/schemas/InstanceRuntime'
        revision:
          type: integer
          minimum: 1
    InstanceCreate:
      type: object
      required: [ id, name, kind, directory, launch ]
      properties:
        id:
          type: string
          pattern: '^[a-zA-Z0-9][a-zA-Z0-9._-]{0,63}$'
        name:
          type: string
          minLength: 1
          maxLength: 128
        kind:
          $ref: '#/components/schemas/InstanceKind'
        directory:
          type: string
        launch:
          $ref: '#/components/schemas/LaunchConfig'
        cpuPolicy:
          $ref: '#/components/schemas/CpuPolicy'
    InstanceUpdate:
      type: object
      minProperties: 1
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 128
        kind:
          $ref: '#/components/schemas/InstanceKind'
        directory:
          type: string
          minLength: 1
          maxLength: 1024
        launch:
          $ref: '#/components/schemas/LaunchConfig'
        cpuPolicy:
          $ref: '#/components/schemas/CpuPolicy'
        updateCommand:
          type: [ string, 'null' ]
          maxLength: 8192
        expiresAt:
          type: [ string, 'null' ]
          format: date-time
    InstancePage:
      type: object
      required: [ items, nextCursor ]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Instance'
        nextCursor:
          type: [ string, 'null' ]
    InstanceAuditAction:
      type: string
      enum: [ START, STOP, KILL, PROCESS_EXIT ]
    InstanceAuditOutcome:
      type: string
      enum: [ ACCEPTED, SUCCEEDED, FAILED, DEGRADED ]
    InstanceAuditRecord:
      type: object
      required:
        - auditId
        - instanceId
        - taskId
        - action
        - outcome
        - runtimeMode
        - supervisorMode
        - reason
        - occurredAt
      properties:
        auditId:
          type: string
          format: uuid
        instanceId:
          type: string
        taskId:
          type: [ string, 'null' ]
          format: uuid
        action:
          $ref: '#/components/schemas/InstanceAuditAction'
        outcome:
          $ref: '#/components/schemas/InstanceAuditOutcome'
        runtimeMode:
          $ref: '#/components/schemas/RuntimeMode'
        supervisorMode:
          $ref: '#/components/schemas/SupervisorMode'
        reason:
          type: [ string, 'null' ]
        occurredAt:
          type: string
          format: date-time
    InstanceAuditPage:
      type: object
      required: [ items, nextCursor ]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/InstanceAuditRecord'
        nextCursor:
          type: [ string, 'null' ]
    PanelAuditPermissionResult:
      type: string
      enum: [ ALLOWED, DENIED, NOT_REQUIRED ]
    PanelAuditEvent:
      type: object
      required:
        - id
        - occurredAt
        - requestId
        - method
        - path
        - statusCode
        - permissionResult
      properties:
        id:
          type: string
          format: uuid
        occurredAt:
          type: string
          format: date-time
        userId:
          type: [ string, 'null' ]
        requestId:
          type: string
          format: uuid
        sourceIp:
          type: [ string, 'null' ]
        method:
          type: string
        path:
          type: string
          description: Request path without query parameters
        statusCode:
          type: integer
          minimum: 100
          maximum: 599
        permissionResult:
          $ref: '#/components/schemas/PanelAuditPermissionResult'
    PanelAuditPage:
      type: object
      required: [ items ]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/PanelAuditEvent'
    LogLine:
      type: object
      required: [ cursor, occurredAt, stream, line ]
      properties:
        cursor:
          type: string
        occurredAt:
          type: string
          format: date-time
        stream:
          type: string
          enum: [ stdout, stderr, system ]
        line:
          type: string
    LogPage:
      type: object
      required: [ items, nextCursor, eventCursor ]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/LogLine'
        nextCursor:
          type: [ string, 'null' ]
        eventCursor:
          type: string
          description: Snapshot baseline used to subscribe to incremental console events
    InstanceMetricSample:
      type: object
      required:
        - occurredAt
        - cpuPercent
        - memoryBytes
        - virtualMemoryBytes
        - uptimeSeconds
      properties:
        occurredAt:
          type: string
          format: date-time
        cpuPercent:
          type: number
          minimum: 0
        memoryBytes:
          type: integer
          minimum: 0
        virtualMemoryBytes:
          type: integer
          minimum: 0
        uptimeSeconds:
          type: integer
          minimum: 0
    ConfigFormat:
      type: string
      enum: [ PROPERTIES, YAML, JSON, TOML, PROVIDER_SPECIFIC ]
    ConfigDocumentSummary:
      type: object
      required: [ documentId, path, format, revision, contentHash, lossy ]
      properties:
        documentId:
          type: string
          pattern: '^[A-Fa-f0-9]{64}$'
        path:
          type: string
        format:
          $ref: '#/components/schemas/ConfigFormat'
        revision:
          type: string
          pattern: '^[A-Fa-f0-9]{64}$'
        contentHash:
          type: string
          pattern: '^[A-Fa-f0-9]{64}$'
        lossy:
          type: boolean
          description: True when structured writes may rewrite source layout and require allowLossy.
    ConfigDocumentPage:
      type: object
      required: [ documents ]
      properties:
        documents:
          type: array
          items:
            $ref: '#/components/schemas/ConfigDocumentSummary'
    ConfigValidationSeverity:
      type: string
      enum: [ ERROR, WARNING ]
    ConfigValidationIssue:
      type: object
      required: [ code, severity, path, field, message, relatedPath, relatedField ]
      properties:
        code:
          type: string
          description: Stable machine-readable validation code.
        severity:
          $ref: '#/components/schemas/ConfigValidationSeverity'
        path:
          type: string
          description: Relative path of the primary configuration file.
        field:
          type: [ string, 'null' ]
          description: Dot-separated field path, or null for a file-level diagnostic.
        message:
          type: string
        relatedPath:
          type: [ string, 'null' ]
          description: Related configuration path when the rule compares two locations.
        relatedField:
          type: [ string, 'null' ]
          description: Related field path when the rule compares two locations.
    ConfigValidationResult:
      type: object
      required: [ valid, checkedDocuments, issues ]
      properties:
        valid:
          type: boolean
          description: False when at least one ERROR diagnostic was produced.
        checkedDocuments:
          type: array
          items:
            type: string
        issues:
          type: array
          items:
            $ref: '#/components/schemas/ConfigValidationIssue'
    ConfigDocument:
      type: object
      required:
        - documentId
        - path
        - format
        - schema
        - uiSchema
        - values
        - revision
        - contentHash
        - unmapped
        - lossy
      properties:
        documentId:
          type: string
          pattern: '^[A-Fa-f0-9]{64}$'
        path:
          type: string
        format:
          $ref: '#/components/schemas/ConfigFormat'
        schema:
          type: object
          additionalProperties: true
        uiSchema:
          type: object
          additionalProperties: true
        values:
          type: object
          additionalProperties: true
        revision:
          type: string
          pattern: '^[A-Fa-f0-9]{64}$'
        contentHash:
          type: string
          pattern: '^[A-Fa-f0-9]{64}$'
        unmapped:
          type: array
          items:
            type: string
        lossy:
          type: boolean
          description: True when structured writes may rewrite source layout and require allowLossy.
    ConfigPatchRequest:
      type: object
      required: [ revision, patch ]
      properties:
        revision:
          type: string
          pattern: '^[A-Fa-f0-9]{64}$'
        patch:
          type: object
          description: Top-level JSON Merge Patch values; null deletes a property.
          additionalProperties: true
        allowLossy:
          type: boolean
          description: Explicitly permit a provider's lossy normalized rewrite.
          default: false
    FileEntry:
      type: object
      required: [ name, path, kind, size, modifiedAt ]
      properties:
        name:
          type: string
        path:
          type: string
        kind:
          type: string
          enum: [ FILE, DIRECTORY, SYMLINK, OTHER ]
        size:
          type: integer
          minimum: 0
        modifiedAt:
          type: string
          format: date-time
        sha256:
          type: [ string, 'null' ]
    FilePage:
      type: object
      required: [ items, nextCursor ]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/FileEntry'
        nextCursor:
          type: [ string, 'null' ]
    FileUploadBeginRequest:
      type: object
      required: [ path, sizeBytes, sha256 ]
      properties:
        path:
          type: string
          minLength: 1
        sizeBytes:
          type: integer
          format: int64
          minimum: 0
          maximum: 4294967296
        sha256:
          type: string
          pattern: '^[A-Fa-f0-9]{64}$'
        expectedSha256:
          type: string
          pattern: '^[A-Fa-f0-9]{64}$'
          description: Current target digest required before creating the upload session
    FileDownloadBeginRequest:
      type: object
      required: [ path ]
      properties:
        path:
          type: string
          minLength: 1
    FileArchiveCreateRequest:
      type: object
      required: [ paths, outputPath ]
      properties:
        paths:
          type: array
          minItems: 1
          maxItems: 128
          description: Recursive selection is limited to 16,384 ZIP entries and 4 GiB of uncompressed source data.
          items:
            type: string
        outputPath:
          type: string
          minLength: 1
    FileUploadStart:
      type: object
      required: [ transferId, chunkSize, nextOffset, sizeBytes ]
      properties:
        transferId:
          type: string
        chunkSize:
          type: integer
          format: int64
          const: 1048576
        nextOffset:
          type: integer
          format: int64
          minimum: 0
        sizeBytes:
          type: integer
          format: int64
          minimum: 0
          maximum: 4294967296
    FileDownloadStart:
      type: object
      required: [ transferId, chunkSize, nextOffset, sizeBytes, sha256 ]
      properties:
        transferId:
          type: string
        chunkSize:
          type: integer
          format: int64
          const: 1048576
        nextOffset:
          type: integer
          format: int64
          minimum: 0
        sizeBytes:
          type: integer
          format: int64
          minimum: 0
          maximum: 4294967296
        sha256:
          type: string
          pattern: '^[A-Fa-f0-9]{64}$'
    FileUploadPart:
      type: object
      required: [ transferId, nextOffset, sizeBytes ]
      properties:
        transferId:
          type: string
        nextOffset:
          type: integer
          format: int64
          minimum: 0
        sizeBytes:
          type: integer
          format: int64
          minimum: 0
          maximum: 4294967296
    FileBatchOperation:
      oneOf:
        - $ref: '#/components/schemas/FileBatchMkdirOperation'
        - $ref: '#/components/schemas/FileBatchMoveOperation'
        - $ref: '#/components/schemas/FileBatchWriteOperation'
        - $ref: '#/components/schemas/FileBatchDeleteOperation'
      discriminator:
        propertyName: kind
    FileBatchMkdirOperation:
      type: object
      required: [ kind, path ]
      properties:
        kind:
          type: string
          const: MKDIR
        path:
          type: string
        recursive:
          type: boolean
          default: false
    FileBatchMoveOperation:
      type: object
      required: [ kind, from, to ]
      properties:
        kind:
          type: string
          const: MOVE
        from:
          type: string
        to:
          type: string
        overwrite:
          type: boolean
          default: false
    FileBatchWriteOperation:
      type: object
      required: [ kind, path, dataBase64 ]
      properties:
        kind:
          type: string
          const: WRITE
        path:
          type: string
        dataBase64:
          type: string
          format: byte
          description: Base64 encoded content of at most 1 MiB after decoding
        expectedSha256:
          type: string
          pattern: '^[A-Fa-f0-9]{64}$'
    FileBatchDeleteOperation:
      type: object
      required: [ kind, path, confirmation ]
      properties:
        kind:
          type: string
          const: DELETE
        path:
          type: string
        recursive:
          type: boolean
          default: false
        confirmation:
          type: string
          const: DELETE
    FileTaskState:
      type: string
      enum: [ RUNNING, SUCCEEDED, FAILED ]
    FileTask:
      type: object
      required: [ taskId, kind, state, progress ]
      properties:
        taskId:
          type: string
        kind:
          type: string
          enum: [ FILE_DELETE, FILE_BATCH, FILE_ARCHIVE_CREATE ]
        state:
          $ref: '#/components/schemas/FileTaskState'
        progress:
          oneOf:
            - type: [ number, 'null' ]
              minimum: 0
              maximum: 1
            - $ref: '#/components/schemas/FileBatchTaskProgress'
        path:
          type: string
        deleted:
          type: boolean
        failedIndex:
          type: integer
          minimum: 0
        results:
          type: array
          items:
            $ref: '#/components/schemas/FileBatchTaskResult'
        archive:
          $ref: '#/components/schemas/FileEntry'
        error:
          type: string
    FileBatchTaskProgress:
      type: object
      required: [ completed, total ]
      properties:
        completed:
          type: integer
          minimum: 0
        total:
          type: integer
          minimum: 1
    FileBatchTaskResult:
      type: object
      required: [ index, state ]
      properties:
        index:
          type: integer
          minimum: 0
        state:
          type: string
          enum: [ SUCCEEDED, FAILED ]
        result:
          type: object
          additionalProperties: true
        error:
          type: string
    TaskState:
      type: string
      enum: [ QUEUED, RUNNING, SUCCEEDED, FAILED, CANCELLED ]
    Task:
      type: object
      required: [ id, kind, state, createdAt ]
      properties:
        id:
          type: string
        kind:
          type: string
        state:
          $ref: '#/components/schemas/TaskState'
        progress:
          type: [ number, 'null' ]
          minimum: 0
          maximum: 1
        createdAt:
          type: string
          format: date-time
        startedAt:
          type: [ string, 'null' ]
          format: date-time
        finishedAt:
          type: [ string, 'null' ]
          format: date-time
        error:
          oneOf:
            - $ref: '#/components/schemas/Error'
            - type: 'null'
    TaskAccepted:
      type: object
      required: [ taskId, acceptedAt ]
      properties:
        taskId:
          type: string
        state:
          type: string
          enum: [ QUEUED, RUNNING ]
        acceptedAt:
          type: string
          format: date-time
    TaskPage:
      type: object
      required: [ items, nextCursor ]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Task'
        nextCursor:
          type: [ string, 'null' ]
    Error:
      type: object
      required: [ code, message, requestId, retryable ]
      properties:
        code:
          type: string
        message:
          type: string
        requestId:
          type: string
        retryable:
          type: boolean
        details:
          type: object
          additionalProperties: true
    ErrorResponse:
      type: object
      required: [ error ]
      properties:
        error:
          $ref: '#/components/schemas/Error'
