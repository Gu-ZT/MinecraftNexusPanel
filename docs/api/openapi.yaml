  /cores/{coreId}/instances/{instanceId}/bedrock-profile/actions/check-port:
    parameters:
      - $ref: '#/components/parameters/CoreId'
      - $ref: '#/components/parameters/InstanceId'
    post:
      tags: [ Bedrock ]
      operationId: checkBedrockPort
      summary: Check the default Bedrock UDP port from Core
      description: |
        Ask the registered Core node to probe the configured Bedrock RakNet
        UDP port. BDS/PocketMine/Nukkit read server.properties and Geyser reads
        config.yml; an unreadable or invalid configuration falls back to the
        profile default, currently 19132, and reports the port source. The
        result distinguishes an available port, a port already in use, and a
        bind failure; it does not assume Java TCP health semantics.
      security:
        - cookieAuth: [ ]
          csrfToken: [ ]
        - bearerAuth: [ ]
      responses:
        '200':
          description: Bedrock UDP port probe result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BedrockPortCheck'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
