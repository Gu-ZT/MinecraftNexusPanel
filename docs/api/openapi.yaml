      - $ref: '#/components/parameters/InstanceId'
    post:
      tags: [ Bedrock ]
      operationId: checkBedrockHealth
      summary: Check Bedrock RakNet health from Core
      description: |
        Ask the registered Core node to send a RakNet Unconnected Ping to the
        configured endpoint and validate the Unconnected Pong response. An
        unspecified bind address is probed through 127.0.0.1 or ::1. This is
        separate from the UDP bind-port check and Java Status health check.
      security:
        - cookieAuth: [ ]
          csrfToken: [ ]
        - bearerAuth: [ ]
      responses:
        '200':
          description: Bedrock RakNet health result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BedrockHealth'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /cores/{coreId}/instances/{instanceId}/extensions:
    parameters:
      - $ref: '#/components/parameters/CoreId'
      - $ref: '#/components/parameters/InstanceId'
    post:
      tags: [ Extensions ]
      operationId: installExtensions
      summary: Start an asynchronous resolved extension plan installation
      description: |
        Re-resolve the requested Modrinth project and required dependencies,
        download only the resulting HTTPS artifacts, verify their declared
        size and SHA-512, and upload each file to Core through transfer-v1.
        The selected directory must be declared by the template; when a kind
        has multiple directories, directory is required. The response only
        accepts the task; query the task endpoint for progress and committed
        installation records. Reusing the same Idempotency-Key for the same
        Core, instance, and extension kind returns the original task without
        starting a duplicate installation. Aggregate rollback is not provided
        yet.
      security:
        - cookieAuth: [ ]
          csrfToken: [ ]
        - bearerAuth: [ ]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExtensionInstallRequest'
      responses:
        '202':
          description: Extension installation task accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskAccepted'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '412':
          $ref: '#/components/responses/PreconditionRequired'
        '422':
          description: The dependency plan or artifact set could not be resolved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '502':
          description: The extension source plan could not be resolved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
    get:
      tags: [ Extensions ]
      operationId: listInstanceExtensions
      summary: Scan installed extensions using a template layout
      description: |
        Read-only scan of the directories declared by the selected install
        template for one extension kind. Hybrid servers keep plugin and mod
        directories separate, and a template may declare multiple directories
        for the same kind. Missing directories are returned as empty pages.
      parameters:
        - name: templateId
          in: query
          required: true
          schema:
            type: string
            minLength: 1
        - name: kind
          in: query
          required: true
          schema:
            $ref: '#/components/schemas/ExtensionKind'
      responses:
        '200':
          description: Extension entries grouped by declared directory
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InstanceExtensionScan'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
    put:
      tags: [ Extensions ]
      operationId: writeInstanceExtension
      summary: Place a prepared extension file within a template layout
      description: |
        Write a prepared local extension artifact through the Core atomic file
        API. The path must be below a directory declared for the selected
        template and extension kind. If-Match can protect an existing artifact
        during an update. This operation does not resolve a source,
        dependencies, compatibility, or an extension installation record.
      security:
        - cookieAuth: [ ]
          csrfToken: [ ]
        - bearerAuth: [ ]
      parameters:
        - name: templateId
          in: query
          required: true
          schema:
            type: string
            minLength: 1
        - name: kind
          in: query
          required: true
          schema:
            $ref: '#/components/schemas/ExtensionKind'
        - name: path
          in: query
          required: true
          schema:
            type: string
            minLength: 1
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
              maxLength: 1048576
      responses:
        '200':
          description: Written extension file entry
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FileEntry'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '412':
          $ref: '#/components/responses/PreconditionRequired'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
    delete:
      tags: [ Extensions ]
      operationId: deleteInstanceExtension
      summary: Delete an extension file within a template layout
      description: |
        Delete one extension file through the Core file task API. The path
        must be below a directory declared for the selected template and
        extension kind. The matching installation record is removed only after
        the Core deletion task succeeds; failed or timed-out tasks retain the
        record, and a newer installation at the same path is protected from an
        older deletion task.
      security:
        - cookieAuth: [ ]
          csrfToken: [ ]
        - bearerAuth: [ ]
      parameters:
        - name: templateId
          in: query
          required: true
          schema:
            type: string
            minLength: 1
        - name: kind
          in: query
          required: true
          schema:
            $ref: '#/components/schemas/ExtensionKind'
        - name: path
          in: query
          required: true
          schema:
            type: string
            minLength: 1
        - name: confirmation
          in: query
          required: true
          schema:
            type: string
            enum: [ DELETE ]
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '202':
          description: Extension deletion task accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskAccepted'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '412':
          $ref: '#/components/responses/PreconditionRequired'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
