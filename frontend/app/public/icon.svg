<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- MCNP 应用图标：等距方块（Minecraft）+ 六边形节点环（Nexus 多节点） -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#262b38"/>
      <stop offset="1" stop-color="#14171f"/>
    </linearGradient>
    <linearGradient id="cubeTop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8ec2ff"/>
      <stop offset="1" stop-color="#6eaaff"/>
    </linearGradient>
  </defs>

  <!-- 底板 -->
  <rect x="16" y="16" width="480" height="480" rx="104" fill="url(#bg)"/>
  <rect x="16.5" y="16.5" width="479" height="479" rx="103.5" fill="none" stroke="#3a4152" stroke-width="1.5"/>

  <!-- Nexus 六边形节点环 -->
  <polygon
    points="256,66 420.7,161 420.7,351 256,446 91.3,351 91.3,161"
    fill="none" stroke="#4c9ffe" stroke-width="10" stroke-opacity="0.45"
    stroke-linejoin="round"/>

  <!-- 等距方块 -->
  <polygon points="256,140 346,192 256,244 166,192" fill="url(#cubeTop)"/>
  <polygon points="166,192 256,244 256,348 166,296" fill="#4c9ffe"/>
  <polygon points="346,192 256,244 256,348 346,296" fill="#2f6fd6"/>

  <!-- 节点：三个交替顶点 -->
  <g stroke="#4c9ffe" stroke-width="8" fill="#14171f">
    <circle cx="420.7" cy="161" r="16"/>
    <circle cx="91.3" cy="351" r="16"/>
    <circle cx="256" cy="446" r="16"/>
  </g>
  <g fill="#4c9ffe">
    <circle cx="420.7" cy="161" r="6"/>
    <circle cx="91.3" cy="351" r="6"/>
    <circle cx="256" cy="446" r="6"/>
  </g>
</svg>
