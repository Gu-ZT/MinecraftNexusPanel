[workspace]
members = ["apps/nexus", "apps/*/src-tauri", "crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"

[workspace.dependencies]
nexus-config = { path = "crates/nexus-config" }
nexus-core = { path = "crates/nexus-core" }
nexus-domain = { path = "crates/nexus-domain" }
nexus-panel = { path = "crates/nexus-panel" }
nexus-protocol = { path = "crates/nexus-protocol" }
nexus-storage = { path = "crates/nexus-storage" }
tauri = { version = "2.11.5", default-features = false, features = ["wry"] }
tauri-build = { version = "2.6.3", features = [] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
unwrap_used = "deny"
