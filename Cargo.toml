[workspace]
members = ["apps/nexus", "apps/*/src-tauri", "crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"

[workspace.dependencies]
nexus-config = { path = "crates/nexus-config" }
nexus-core = { path = "crates/nexus-core" }
nexus-domain = { path = "crates/nexus-domain" }
nexus-panel = { path = "crates/nexus-panel" }
nexus-protocol = { path = "crates/nexus-protocol" }
nexus-storage = { path = "crates/nexus-storage" }
axum = "0.8.9"
base64 = "0.23.0"
hkdf = "0.13.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sha2 = "0.11.0"
snow = "0.10.0"
rusqlite = { version = "0.40.1", default-features = false, features = ["bundled"] }
tauri = { version = "2.11.5", default-features = false, features = ["wry"] }
tauri-build = { version = "2.6.3", features = [] }
tempfile = "3.27.0"
thiserror = "2.0.17"
time = { version = "0.3.44", features = ["formatting"] }
tokio = { version = "1.53.1", features = ["io-util", "macros", "net", "rt-multi-thread"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features = ["env-filter", "fmt"] }
uuid = { version = "1.18.1", features = ["serde", "v7"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
unwrap_used = "deny"
