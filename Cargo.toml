[workspace]
members = ["apps/nexus", "apps/*/src-tauri", "crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"

[workspace.dependencies]
aes-gcm = "0.10.3"
argon2 = { version = "0.5.3", default-features = false, features = ["std"] }
nexus-config = { path = "crates/nexus-config" }
nexus-core = { path = "crates/nexus-core" }
nexus-domain = { path = "crates/nexus-domain" }
nexus-panel = { path = "crates/nexus-panel" }
nexus-protocol = { path = "crates/nexus-protocol" }
nexus-storage = { path = "crates/nexus-storage" }
axum = { version = "0.8.9", features = ["ws"] }
base64 = "0.23.0"
getrandom = "0.3.4"
flate2 = "1.1.9"
hkdf = "0.13.0"
rcgen = "0.13.2"
rustls = { version = "0.23.35", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pemfile = "2.2.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
serde_yaml = "0.9.34"
quick-xml = "0.38.4"
sha2 = "0.11.0"
sha1 = "0.10.7"
snow = "0.10.0"
sysinfo = { version = "0.33.1", default-features = false, features = ["system"] }
rusqlite = { version = "0.40.1", default-features = false, features = ["bundled"] }
reqwest = { version = "0.13.4", default-features = false, features = ["rustls-no-provider"] }
tauri = { version = "2.11.5", default-features = false, features = ["wry"] }
tauri-build = { version = "2.6.3", features = [] }
tempfile = "3.27.0"
thiserror = "2.0.17"
time = { version = "0.3.44", features = ["formatting", "parsing"] }
toml = "0.8.23"
tokio = { version = "1.53.1", features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "sync", "time"] }
tokio-rustls = { version = "0.26.4", default-features = false, features = ["ring", "tls12"] }
tar = "0.4.44"
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features = ["env-filter", "fmt"] }
url = "2.5.7"
uuid = { version = "1.18.1", features = ["serde", "v7"] }
webpki-roots = "1.0.4"
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
unwrap_used = "deny"
